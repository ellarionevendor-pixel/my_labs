
<!DOCTYPE html>
<html>
<head>
    <title>AngularJS Expression Playground</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-app="App" ng-controller="Controller">

    <!-- ========================================= -->
    <!-- 1. Basic AngularJS interpolation          -->
    <!-- ========================================= -->

    <h2>Basic AngularJS Expressions</h2>

    <p id="test"></p>

    <p>{{ firstName }}</p>
    <p>{{ 5 * 203 }}</p>


    <!-- ========================================= -->
    <!-- 2. AngularJS expression evaluation        -->
    <!-- ========================================= -->

    <h2>AngularJS Expression Experiments</h2>

    <!-- Experiment using the $on function's constructor -->
    {{ $on.constructor('alert(1)')() }}

    <!-- Payload that I used in the PortSwigger lab -->
    <!-- {{ $eval.constructor('alert(1)')() }} -->


    <!-- ========================================= -->
    <!-- 3. JavaScript Function constructor        -->
    <!-- ========================================= -->

    <h2>JavaScript Function Constructor</h2>

    <script>
        // Function constructor: creates and executes a new function
        Function('console.log("AAAAA")')();


        // A regular JavaScript function
        function CCC() {
            console.log('Text');
        }

        // Inspect the function's constructor
        console.log(CCC.constructor);


        // Create another function using the Function constructor
        let CCC_2ndVers = CCC.constructor(
            'console.log("Im additional function")'
        );

        // Execute the newly created function
        CCC_2ndVers();
    </script>


    <!-- ========================================= -->
    <!-- 4. AngularJS application setup            -->
    <!-- ========================================= -->

    <script>
        var app = angular.module('App', []);

        app.controller('Controller', function($scope) {
            $scope.firstName = "Adam";
        });
    </script>

</body>
</html>
